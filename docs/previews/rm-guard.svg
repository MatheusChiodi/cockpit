<text y="66" xml:space="preserve"><tspan x="24.0" textLength="47.0" lengthAdjust="spacingAndGlyphs" fill="#8fd18b">● Bash</tspan><tspan x="71.0" textLength="86.1" lengthAdjust="spacingAndGlyphs" fill="#d5dbe6">(rm -rf ~/)</tspan></text>
<text y="87" xml:space="preserve"><tspan x="24.0" textLength="469.8" lengthAdjust="spacingAndGlyphs" fill="#f07b7b">  ⎿ rm-guard blocked the command: recursively deleting "~/".</tspan></text>
<text y="108" xml:space="preserve"><tspan x="24.0" textLength="477.6" lengthAdjust="spacingAndGlyphs" fill="#f07b7b">    If it really is intended, ask the user to run it by hand.</tspan></text>
