<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Cascadia Mono',monospace" font-size="13">
<rect x="184.4" y="44" width="325.0" height="20" rx="3" fill="#3a5a9c" stroke="none"/><text y="58" xml:space="preserve"><tspan x="22.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#d97757">●</tspan><tspan x="29.8" textLength="156.6" lengthAdjust="spacingAndGlyphs" fill="#d8dee9"> O timeout padrão é </tspan><tspan x="186.4" textLength="321.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff">30 segundos e não é configurável por rota</tspan><tspan x="507.5" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#d8dee9">.</tspan></text>
