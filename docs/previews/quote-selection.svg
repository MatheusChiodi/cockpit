<text y="98" xml:space="preserve"><tspan x="22.0" textLength="62.6" lengthAdjust="spacingAndGlyphs" fill="#e6edf7">&gt; /quote</tspan></text>
<text y="118" xml:space="preserve"><tspan x="22.0" textLength="227.1" lengthAdjust="spacingAndGlyphs" fill="#6b7689">  ⎿ Seleção citada no prompt.</tspan></text>
