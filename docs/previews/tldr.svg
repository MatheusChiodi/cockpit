<svg xmlns="http://www.w3.org/2000/svg" width="760" height="172" viewBox="0 0 760 172" role="img" aria-label="Prévia do mod tldr no terminal">
<rect width="760" height="172" rx="10" fill="#141922"/>
<rect width="760" height="34" rx="10" fill="#1d2433"/>
<rect y="24" width="760" height="10" fill="#1d2433"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="380" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8792a8">claude — tldr</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Cascadia Mono',monospace" font-size="13">
<text y="58" xml:space="preserve"><tspan x="22.0" textLength="7.8" lengthAdjust="spacingAndGlyphs" fill="#d97757">●</tspan><tspan x="29.8" textLength="477.6" lengthAdjust="spacingAndGlyphs" fill="#d8dee9"> ...e por isso o cache precisa ser invalidado nos três pontos</tspan></text>
<text y="78" xml:space="preserve"><tspan x="22.0" textLength="422.8" lengthAdjust="spacingAndGlyphs" fill="#d8dee9">  descritos acima, na ordem em que as migrações rodam.</tspan></text>
<text y="98" xml:space="preserve"></text>
<text y="118" xml:space="preserve"><tspan x="22.0" textLength="62.6" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="700">  TL;DR:</tspan><tspan x="84.6" textLength="415.0" lengthAdjust="spacingAndGlyphs" fill="#d8dee9"> o bug vem do cache não invalidado após a migração; a</tspan></text>
<text y="138" xml:space="preserve"><tspan x="22.0" textLength="462.0" lengthAdjust="spacingAndGlyphs" fill="#d8dee9">  correção limpa o cache em três pontos e os testes passam.</tspan></text>
